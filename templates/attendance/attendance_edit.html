{% extends 'students/base.html' %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
  <div style="margin-bottom:24px;">
    <a href="{% url 'attendance:attendance_list' %}" style="display:inline-flex; align-items:center; gap:6px; font-size:0.86rem; color:var(--text-muted); margin-bottom:12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Records
    </a>
    <h1 style="font-size:1.6rem; font-weight:800; color:#fff;">Edit Attendance Record</h1>
  </div>

  <div class="glass-card" style="padding:32px;">
    <form method="POST" id="edit-attendance-form" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="field-error-text"><span>{{ e }}</span></div>{% endfor %}
        </div>
      {% endfor %}
      <div class="form-actions">
        <a href="{% url 'attendance:attendance_list' %}" class="btn-secondary" id="btn-cancel-edit-att">Cancel</a>
        <button type="submit" class="btn-primary" id="btn-save-edit-att">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          Update Record
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
