{% extends 'students/base.html' %}

{% block content %}
<div class="glass-card confirm-delete-box">
  <div class="warning-icon-wrapper">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </div>

  <h2>Confirm Remove Timetable Slot</h2>
  <p class="delete-warning-text">
    Are you sure you want to remove <strong>{{ entry.subject.name }}</strong> for
    <strong>{{ entry.student_class }}</strong> on <strong>{{ entry.day_of_week }}</strong> during
    <strong>{{ entry.period.name }}</strong>?
  </p>

  <form method="POST">
    {% csrf_token %}
    <div class="confirm-actions">
      <a href="{% url 'timetable:class_timetable' %}?class={{ entry.student_class }}" class="btn-secondary">Cancel</a>
      <button type="submit" class="btn-danger">Remove Slot</button>
    </div>
  </form>
</div>
{% endblock %}
