{% extends 'students/base.html' %}

{% block content %}
<div class="glass-card confirm-delete-box">
  <div class="warning-icon-wrapper">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </div>

  <h2>Confirm Delete Exam</h2>
  <p class="delete-warning-text">
    Are you sure you want to delete the examination <strong>{{ exam.name }}</strong> ({{ exam.academic_year }})?
    All marks and schedules associated with this exam will be permanently removed.
  </p>

  <form method="POST">
    {% csrf_token %}
    <div class="confirm-actions">
      <a href="{% url 'exams:exam_list' %}" class="btn-secondary" id="cancel-delete-btn">Cancel</a>
      <button type="submit" class="btn-danger" id="confirm-delete-btn">Delete Permanently</button>
    </div>
  </form>
</div>
{% endblock %}
